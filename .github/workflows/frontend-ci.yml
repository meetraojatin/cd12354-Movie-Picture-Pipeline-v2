name: Frontend Continuous Integration

on:
  pull_request:
    paths:
      - 'starter/frontend/**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'starter/frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd starter/frontend
          npm ci || npm install

      - name: Lint code
        run: |
          cd starter/frontend
          npm run lint || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'starter/frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd starter/frontend
          npm ci || npm install

      - name: Run Tests
        run: |
          cd starter/frontend
          npm test -- --watchAll=false

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker Image (Dry Run)
        run: |
          cd starter/frontend
          docker build --build-arg REACT_APP_MOVIE_API_URL="http://localhost:5000" -t frontend:ci .