name: Frontend Continuous Integration

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'starter/frontend/package-lock.json'
      - name: Install dependencies
        run: |
          cd starter/frontend
          npm ci
      - name: Run lint
        run: |
          cd starter/frontend
          npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'starter/frontend/package-lock.json'
      - name: Install dependencies
        run: |
          cd starter/frontend
          npm ci
      - name: Run tests
        run: |
          cd starter/frontend
          CI=true npm test -- --watchAll=false

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'starter/frontend/package-lock.json'
      - name: Install dependencies
        run: |
          cd starter/frontend
          npm ci
      - name: Run tests in build job
        run: |
          cd starter/frontend
          CI=true npm test -- --watchAll=false
      - name: Build application with Docker
        run: |
          cd starter/frontend
          docker build -t frontend:ci-test .